# XcodeGen project definition
# Run `xcodegen generate` to produce RunningHealthReview.xcodeproj

name: RunningHealthReview

options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"

targets:
  RunningHealthReview:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RunningHealthReview
        excludes:
          - "**/.DS_Store"
    entitlements:
      path: RunningHealthReview/RunningHealthReview.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.RunningHealthReview
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: RunningHealthReview/Info.plist
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: "NO"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "iPhone Developer"
        Release:
          CODE_SIGN_IDENTITY: "iPhone Distribution"
    scheme:
      testTargets: []
